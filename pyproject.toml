[project]
name = "hermes-roam"
version = "0.4.0"
description = "Encrypted, host-scoped sync of your Hermes Agent home across devices (S3/R2 or git)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "cryptography>=42,<51",
  "pyyaml>=6.0,<7",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "ruff>=0.5,<1", "boto3>=1.34,<2", "moto[s3]>=5.0,<6"]

[tool.pytest.ini_options]
addopts = "-ra --confcutdir=tests"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
