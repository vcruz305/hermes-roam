# hermes-roam plugin manifest (Hermes plugin format, manifest v2)
name: hermes-roam
version: 0.4.0
manifest_version: 2
description: >-
  Encrypted, host-scoped sync of the Hermes Agent home across devices.
  Pushes an AES-256-GCM encrypted bundle of the shared home (skills, memories,
  SOUL, config minus host-specific keys) to S3, Cloudflare R2, a private git
  repo, or a local directory, and pulls it back on another machine with a
  journaled, backed-up install. Secrets are never synced.
author: vcruz305
license: Apache-2.0
homepage: https://github.com/vcruz305/hermes-roam
tags: [sync, backup, config, profiles, s3, r2, git]
requires_hermes: ">=0.22.0"
provides_tools:
  - roam_status
  - roam_push
  - roam_pull
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_llm_call
requires_env:
  - name: ROAM_ARCHIVE_KEY
    description: >-
      Shared 32-byte key that encrypts every roam bundle and signs the remote
      head; every device must use the same value. Generate it with
      python -c "import secrets;print(secrets.token_urlsafe(32))" and put it
      in the active profile's .env; the token is 32 random bytes in
      base64url form.
    secret: true
python_dependencies:
  - "cryptography>=42,<51"
  - "pyyaml>=6.0,<7"
  - "boto3>=1.34,<2"
config_schema:
  backend:
    type: str
    default: local
    description: >-
      Where bundles are stored: s3 (S3 or Cloudflare R2), git (a private git
      repo), or local (a plain directory, for tests and demos).
  device_name:
    type: str
    default: ""
    description: >-
      Name this device is known by in the fleet roster. Empty means the machine
      hostname.
  s3_bucket:
    type: str
    default: ""
    description: >-
      S3/R2 bucket name (backend s3). R2 credentials come from the
      ROAM_S3_ACCESS_KEY_ID and ROAM_S3_SECRET_ACCESS_KEY secrets, checked at
      runtime; use an API token scoped to Object Read & Write on this bucket.
  s3_prefix:
    type: str
    default: hermes-roam
    description: Key prefix inside the bucket (backend s3).
  s3_endpoint_url:
    type: str
    default: ""
    description: >-
      S3-compatible endpoint; for Cloudflare R2 use
      https://<account_id>.r2.cloudflarestorage.com. Empty means AWS S3.
  s3_region:
    type: str
    default: auto
    description: >-
      Bucket region; Cloudflare R2 accepts and expects the literal value auto.
  git_remote:
    type: str
    default: ""
    description: >-
      Private git repository URL used as the remote store (backend git).
      Credentials stay in the user's SSH configuration; roam never stores them.
  git_branch:
    type: str
    default: roam
    description: Branch used inside the git mirror (backend git).
  local_dir:
    type: str
    default: ""
    description: Directory that stores bundles (backend local).
  sync_sessions:
    type: bool
    default: false
    description: >-
      Include session transcripts in pushes (they grow large; opt-in).
  sync_cron:
    type: bool
    default: false
    description: Include cron job definitions in pushes (opt-in).
  auto_push:
    type: bool
    default: false
    description: >-
      Push automatically at the end of a session when shared files changed,
      at most once per push_debounce_seconds.
  auto_pull_shared:
    type: bool
    default: false
    description: >-
      At session start, when the remote is ahead, automatically pull only the
      shared skills, memories and SOUL.md (never config.yaml). Everything
      else still waits for an explicit `hermes roam pull`.
  allow_agent_apply:
    type: bool
    default: false
    description: >-
      Allow the model (the roam_pull tool with apply=true) to run the journaled
      install by itself. Off by default: the tool then refuses apply=true and
      the model must ask the user to run `/roam pull apply` or `hermes roam
      pull --apply` in person.
  push_debounce_seconds:
    type: int
    default: 300
    description: Minimum seconds between automatic pushes (auto_push).
  operation_timeout:
    type: int
    default: 900
    description: >-
      Seconds one push or pull operation may take in total, including every
      backend call; status, doctor and diff get a fixed 60 s budget. The
      operation fails once the budget is spent. Raise it for slow links
      instead of disabling deadlines.
  git_transfer_timeout:
    type: int
    default: 600
    description: >-
      Seconds a single git data transfer may take within the operation
      budget (backend git); never more than operation_timeout. Transfers
      that exceed it fail. Prefer the S3/R2 backend for large homes.
  backup_keep:
    type: int
    default: 5
    description: >-
      How many pull backup directories are kept before the oldest is pruned;
      install journals older than the kept window are pruned with them. At
      least 1 is always kept so a failed install can be rolled back.
  max_bundle_bytes:
    type: int
    default: 2147483648
    description: >-
      Refuse to build a bundle larger than this many bytes (default 2 GiB).
